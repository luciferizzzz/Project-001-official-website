<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#F5F0E6" />
    <title>Page not found — Project 001</title>
    <link rel="icon" href="/icons/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <style>
      @font-face {
        font-family: 'Newsreader';
        src: url('/assets/fonts/newsreader-latin-normal.woff2') format('woff2');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Instrument Sans';
        src: url('/assets/fonts/instrument-sans-latin-normal.woff2') format('woff2');
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/assets/fonts/jetbrains-mono-latin-normal.woff2') format('woff2');
        font-weight: 100 800;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --paper: #f5f0e6;
        --surface: #e8e5df;
        --ink: #26354a;
        --ink-soft: #4e5a6a;
        --ink-muted: #566171;
        --burgundy: #701c2c;
        --gold: #c5a253;
        --gold-ink: #74581f;
        --line: rgba(38, 53, 74, 0.16);
        --line-strong: rgba(38, 53, 74, 0.32);
        --display: 'Newsreader', Georgia, serif;
        --sans: 'Instrument Sans', system-ui, sans-serif;
        --mono: 'JetBrains Mono', Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 4vw, 3rem);
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(to right, var(--line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--line) 1px, transparent 1px);
        background-size: 72px 72px;
        opacity: 0.35;
        pointer-events: none;
      }

      a:focus-visible {
        outline: 2px solid var(--burgundy);
        outline-offset: 3px;
      }

      .frame {
        position: relative;
        width: min(720px, 100%);
        padding: clamp(1.5rem, 5vw, 3.5rem);
        border: 1px solid var(--line-strong);
        background: var(--paper);
      }

      .frame::before,
      .frame::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        border-color: var(--gold);
        border-style: solid;
      }

      .frame::before {
        top: -1px;
        left: -1px;
        border-width: 1px 0 0 1px;
      }

      .frame::after {
        right: -1px;
        bottom: -1px;
        border-width: 0 1px 1px 0;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding-bottom: 1.1rem;
        border-bottom: 1px solid var(--line);
      }

      .top img {
        width: auto;
        height: 40px;
      }

      .code {
        color: var(--gold-ink);
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: clamp(2rem, 5vw, 3rem) 0 0;
        font-family: var(--display);
        font-size: clamp(2.6rem, 7vw, 4.6rem);
        font-weight: 300;
        letter-spacing: -0.03em;
        line-height: 0.98;
      }

      h1 em {
        color: var(--burgundy);
        font-style: italic;
      }

      p {
        max-width: 34rem;
        margin: 1.4rem 0 0;
        color: var(--ink-soft);
        font-size: 0.98rem;
        line-height: 1.7;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        margin-top: 2rem;
        padding: 0.9rem 1.3rem;
        background: var(--burgundy);
        color: var(--paper);
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background-color 0.25s ease;
      }

      .back:hover {
        background: #58131f;
      }

      .bottom {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.5rem 1rem;
        margin-top: clamp(2.5rem, 5vw, 3.5rem);
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--ink-muted);
        font-family: var(--mono);
        font-size: 0.56rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="frame">
      <div class="top">
        <img
          src="/assets/brand/project-001-logo-small.png"
          width="160"
          height="139"
          alt="Project 001 logo"
        />
        <span class="code">404 / Not found</span>
      </div>

      <h1>This page is not<br />part of the <em>record</em>.</h1>

      <p>
        The address may be incorrect, or the page may have moved. Return to the
        Project 001 homepage to continue.
      </p>

      <a class="back" href="/">
        Return to Project 001
        <span aria-hidden="true">&rarr;</span>
      </a>

      <div class="bottom">
        <span>Project 001</span>
        <span>Freedom Through Technology.</span>
      </div>
    </main>
  </body>
</html>
